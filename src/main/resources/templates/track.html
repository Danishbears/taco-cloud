<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - Taco Cloud</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" th:href="@{/css/styles.css}" />

    <style>
        .track-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .status-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            background-color: #feebc8;
            color: #c05621;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        #map {
            width: 100%;
            height: 450px;
            min-height: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background-color: #e5e7eb;
            margin-top: 20px;
            z-index: 1;
        }

        .courier-emoji-marker {
            background: transparent;
            border: none;
        }

        .nav-links {
            margin-bottom: 20px;
        }

        .nav-links a {
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="track-container">
    <div class="nav-links">
        <a th:href="@{/orders/history}">← Back to Order History</a> |
        <a th:href="@{/}">Home</a>
    </div>

    <h1>Live Order Tracking 🛵</h1>

    <div class="status-card">
        <div class="status-header">
            <h2 id="order-id"
                th:data-id="${order.id}"
                th:data-address="${order.deliveryStreet + ', ' + order.deliveryCity}"
                th:text="'Order #' + ${order.id}">
                Order #123
            </h2>
            <span class="status-badge" id="status-text" th:text="${order.status}">CREATED</span>
        </div>

        <p><strong>Deliver to:</strong> <span th:text="${order.deliveryName}">John Doe</span></p>
        <p><strong>Address:</strong> <span th:text="${order.deliveryStreet + ', ' + order.deliveryCity}">123 Main St, City</span></p>
        <p><strong>Total Price:</strong> <span th:text="${'$' + #numbers.formatDecimal(order.totalPrice, 1, 2)}">$0.00</span></p>
    </div>

    <div id="map"></div>
</div>

<script th:src="@{/js/tracker.js}"></script>

</body>
</html>
