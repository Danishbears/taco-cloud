<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Taco Cloud</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <script th:src="@{/js/theme.js}"></script>
</head>

<body class="auth-page">

<!-- HEADER -->
<header class="site-header">
    <div class="header-inner">

        <a th:href="@{/}" class="logo">
            <img th:src="@{/images/TacoCloud.png}" alt="Taco Cloud">
        </a>

        <nav class="main-nav">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/design}">Our tacos</a>
            <a th:href="@{/about}">About us</a>
        </nav>

        <a th:href="@{/register}" class="header-button">
            Create account
        </a>

    </div>
</header>


<!-- LOGIN -->
<main class="auth-container">

    <div class="auth-card">

        <!-- LOGO -->
        <div class="auth-logo">
            <img th:src="@{/images/TacoCloud.png}"
                 alt="Taco Cloud Logo">
        </div>


        <!-- TITLE -->
        <div class="auth-heading">

            <span class="section-label">WELCOME BACK</span>

            <h1>Sign in to Taco Cloud</h1>

            <p>
                Sign in to continue creating your perfect tacos.
            </p>

        </div>


        <!-- ERROR -->
        <div class="login-error"
             th:if="${error}">

            <span class="error-icon">!</span>

            <div>
                <strong>Unable to sign in</strong>
                <p>Check your username and password and try again.</p>
            </div>

        </div>


        <!-- GITHUB -->
        <a th:href="@{/oauth2/authorization/github}"
           class="github-button">

            <span class="github-icon">●</span>

            <span>Continue with GitHub</span>

        </a>


        <!-- DIVIDER -->
        <div class="auth-divider">
            <span>or continue with username</span>
        </div>


        <!-- LOGIN FORM -->
        <form method="POST"
              th:action="@{/login}"
              id="loginForm"
              class="auth-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text"
                       name="username"
                       id="username"
                       placeholder="Enter your username"
                       autocomplete="username"
                       required />

            </div>


            <div class="form-group">

                <div class="password-label">
                    <label for="password">
                        Password
                    </label>
                </div>

                <input type="password"
                       name="password"
                       id="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required />

            </div>


            <button type="submit"
                    class="auth-submit">
                Sign in
            </button>

        </form>


        <!-- REGISTER -->
        <div class="auth-footer">

            <span>Don't have an account?</span>

            <a th:href="@{/register}">
                Create one
            </a>

        </div>

    </div>

</main>


<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
