<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notifications - Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<h1>Your notifications 🔔</h1>
<a th:href="@{/profile}">Back to profile</a> | <a th:href="@{/design}">Order a taco</a>
<hr/>

<div th:fragment="notificationList">
    <div th:if="${#lists.isEmpty(notification)}">
        <p>No notifications</p>
    </div>

    <div th:if="${!#lists.isEmpty(notification)}">
        <ul>
            <li th:each="n : ${notification}" th:style="${!n.read} ? 'font-weight: bold;' : ''">
                <span th:text="${#temporals.format(n.createdAt, 'dd-MMM-yyyy HH:mm')}">Time</span> —
                <span th:text="${n.message}">Message</span>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
