<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile - Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>

<h1>User Profile</h1>

<div>
    <p>Logged in as: <strong th:text="${user.username}">Username</strong></p>

    <!-- Кнопка выходя (Logout) -->
    <form method="POST" th:action="@{/logout}">
        <button type="submit">Logout</button>
    </form>
</div>

<hr/>

<p><a th:href="@{/orders/history}">View Order History</a> | <a th:href="@{/design}">Design a Taco</a></p>

<div th:if="${param.success}">
    <p style="color: green;">Profile updated successfully!</p>
</div>

<h2>Edit Personal & Delivery Info</h2>

<form method="POST" th:action="@{/profile}" th:object="${profileForm}">
    <div>
        <label for="fullname">Full Name: </label>
        <input type="text" th:field="*{fullname}" id="fullname"/>
    </div>
    <br/>
    <div>
        <label for="street">Street Address: </label>
        <input type="text" th:field="*{street}" id="street"/>
    </div>
    <br/>
    <div>
        <label for="city">City: </label>
        <input type="text" th:field="*{city}" id="city"/>
    </div>
    <br/>
    <div>
        <label for="state">State: </label>
        <input type="text" th:field="*{state}" id="state"/>
    </div>
    <br/>
    <div>
        <label for="zip">Zip Code: </label>
        <input type="text" th:field="*{zip}" id="zip"/>
    </div>
    <br/>
    <div>
        <label for="phoneNumber">Phone Number: </label>
        <input type="text" th:field="*{phoneNumber}" id="phoneNumber"/>
    </div>
    <br/>
    <h2>Your Order History</h2>
    <div th:replace="~{orderHistory :: orderList}">
    </div>
    <button type="submit">Save Changes</button>
</form>

</body>
</html>
